[package]
name = "trayask"
version = "0.1.0"
description = "TrayAsk - tray widget for LLM chat"
authors = ["TrayAsk"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"
# keyring has NO default features: without these it silently falls back to
# the in-memory mock store (EntryOnly persistence), where a set on one Entry
# instance is invisible to a get on the next — i.e. keys could never persist.
# apple-native = macOS Keychain, windows-native = Credential Manager,
# sync-secret-service = GNOME Keyring / KWallet via D-Bus Secret Service.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
